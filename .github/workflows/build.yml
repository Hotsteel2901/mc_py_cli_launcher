name: Build Multi-Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: mc_launcher.exe
          - os: ubuntu-latest
            artifact: mc_launcher-linux
          - os: macos-latest
            artifact: mc_launcher-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        env:
          PYINSTALLER_NAME: ${{ matrix.artifact }}
        run: pyinstaller --clean mc_launcher.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: 自动构建 - ${{ github.sha }}
          files: |
            artifacts/mc_launcher.exe/mc_launcher.exe
            artifacts/mc_launcher-linux/mc_launcher-linux
            artifacts/mc_launcher-macos/mc_launcher-macos
