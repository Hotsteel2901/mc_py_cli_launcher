[package]
name = "mc-launcher"
version = "2.0.1"
edition = "2021"
description = "Simple Minecraft CLI Launcher — Microsoft + offline + Fabric/Forge/NeoForge + Modrinth mods"
authors = ["Hotsteel2901"]
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
md-5 = "0.10"
zip = "0.6"
regex = "1"
webbrowser = "0.8"
url = "2"
rayon = "1"
quick-xml = "0.31"
which = "6"
glob = "0.3"
dirs = "5"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = "z"
lto = true
strip = true
